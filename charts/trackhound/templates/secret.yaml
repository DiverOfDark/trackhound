{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trackhound.fullname" . }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  GMAIL_IMAP_PASSWORD: {{ .Values.secrets.gmailImapPassword | quote }}
  TRACK17_SECURITY_KEY: {{ .Values.secrets.track17SecurityKey | quote }}
{{- end }}
