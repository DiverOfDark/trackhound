replicaCount: 1

image:
  repository: ghcr.io/diverofdark/trackhound
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: trackhound.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

config:
  bindAddr: 0.0.0.0:8080
  databaseUrl: sqlite:///data/trackhound.sqlite
  gmailScanIntervalSeconds: 1800
  track17SyncIntervalSeconds: 3600
  gmailQuery: "newer_than:14d (shipment OR tracking OR package OR parcel OR delivery OR amazon OR dhl OR dpd OR ups OR fedex OR gls)"
  openaiModel: gpt-4.1-nano
  openaiUrl: https://api.openai.com/v1/chat/completions
  gmailImapHost: imap.gmail.com
  gmailImapPort: 993
  gmailImapUsername: ""
  gmailImapMailbox: INBOX

secrets:
  existingSecret: ""
  openaiApiKey: ""
  gmailImapPassword: ""
  track17SecurityKey: ""

# Additional Kubernetes manifests to render with this release. Useful for
# ExternalSecret, SecretStore, NetworkPolicy, ServiceMonitor, etc.
# Entries are evaluated with Helm's tpl, so values like
# {{ include "trackhound.fullname" . }} can be used inside them.
additionalObjects: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
